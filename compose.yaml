services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: 512m
  watchdog:
    build: .
    command: ["python", "watchdog/run.py"]
    env_file: .env
    restart: unless-stopped
    volumes: ["./data:/app/data"]
    mem_limit: 128m
